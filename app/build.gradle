import java.time.LocalDate
import java.time.ZoneId
import java.time.format.DateTimeFormatter
import org.gradle.api.provider.ValueSource
import org.gradle.api.provider.ValueSourceParameters
import com.android.build.api.variant.FilterConfiguration

plugins {
    alias(libs.plugins.android.application)
}

/** 提供北京时间的打包日期 */
abstract class BuildDateValueSource implements ValueSource<String, ValueSourceParameters.None> {
    /**
     * 读取当前日期
     *
     * @return 北京时间的 ISO 日期，格式为 yyyy-MM-dd
     */
    @Override
    String obtain() {
        return LocalDate.now(ZoneId.of("Asia/Shanghai")).toString()
    }
}

// 统一使用同一次读取的日期，确保版本名和内部版本号一致。
def buildDate = LocalDate.parse(providers.of(BuildDateValueSource) {}.get())
// 版本名的年份手动维护在 gradle.properties，月日由打包日期生成。
def versionNameYear = providers.gradleProperty("versionNameYear").get()
def buildVersionName = "${versionNameYear}.${buildDate.monthValue}.${buildDate.dayOfMonth}".toString()
def buildVersionCode = buildDate.format(DateTimeFormatter.BASIC_ISO_DATE).toInteger()

def brandDisplayName = providers.fileContents(
        layout.projectDirectory.file("src/main/res/values/brand.xml")).asText.map { content ->
    def resources = new groovy.xml.XmlSlurper().parseText(content)
    def displayName = resources.string.find { it.@name.text() == "app_name" }.text().trim()
    def invalidCharacters = ['<', '>', ':', '"', '/', '\\', '|', '?', '*']
    if (!displayName || displayName.any { character ->
        character in invalidCharacters || Character.isISOControl(character.charAt(0))
    }) {
        throw new GradleException("brand.xml app_name must be a nonempty, valid filename prefix")
    }
    displayName
}

android {
    namespace 'github.vhoom.zhijian'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "github.vhoom.zhijian"
        minSdk 29
        targetSdk 36
        versionCode buildVersionCode
        versionName buildVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    // 生成 ARM 64 位、ARM 32 位专用包和包含全部可用架构的通用包。
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'src/main/keepRules/rules.keep'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.room.runtime
    annotationProcessor libs.androidx.room.compiler
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
androidComponents {
    onVariants(selector().all()) { variant ->
        def buildTypeName = variant.buildType
        variant.outputs.forEach { output ->
            // 无 ABI 过滤器的输出是通用包；加入架构后缀以区分同一变体的各个文件。
            def abiName = output.filters.find { filter ->
                filter.filterType == FilterConfiguration.FilterType.ABI
            }?.identifier ?: 'universal'
            output.outputFileName.set(brandDisplayName.zip(output.versionName) { displayName, versionName ->
                "${displayName}_${versionName}_${buildTypeName}_${abiName}.apk".toString()
            })
        }
    }
}
